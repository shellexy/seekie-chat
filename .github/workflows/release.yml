name: Release

# 推 v* 标签时三个平台各打一份包，全部成功后才发布到 Releases；
# 手动触发只构建、产物留在 Actions 里，方便先跑通流程再真正发版。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 打包 ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest 正在迁往 26.04，固定 24.04，免得 deb/AppImage 的工具链跟着漂。
          - os: ubuntu-24.04
            platform: linux
            args: --linux
          - os: windows-latest
            platform: win
            args: --win
          - os: macos-latest
            platform: mac
            # runner 本身是 arm64，x64 一起出 Intel Mac 才能用：没有原生运行时依赖，交叉打包是安全的。
            args: --mac --x64 --arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 标签和 package.json 版本对不上时，发出去的包版本号就是错的，宁可这里先挂掉。
      - name: 校验标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node -e "const v=require('./package.json').version,t=process.env.GITHUB_REF_NAME.slice(1);if(v!==t){console.error('标签',process.env.GITHUB_REF_NAME,'与 package.json 的',v,'不一致');process.exit(1)}"
      - run: npm run check
      - run: npm run build
      # 没有签名证书：显式关掉自动查找，否则 macOS 上可能报错中断。产物未签名，首次打开要手动放行。
      - name: 打包
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/*.dmg

  flatpak:
    name: 打包 flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # flatpak 要的是一棵装好的应用树，所以先出 --linux dir，再把它当成 package 目录用。
      - run: npx electron-builder --linux dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 安装 flatpak 与运行时
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08
      - name: 构建 bundle
        run: |
          set -euo pipefail
          # 清单里引用的是同级的 app/ 与几个安装文件，所以在临时目录里拼一个构建上下文，
          # 不往仓库里写生成物。
          work="$RUNNER_TEMP/flatpak"
          mkdir -p "$work/app"
          cp -a release/linux-unpacked/. "$work/app/"
          cp build/flatpak/io.github.shellexy.SeekieChat.yml "$work/"
          cp build/flatpak/io.github.shellexy.SeekieChat.desktop "$work/"
          cp build/flatpak/io.github.shellexy.SeekieChat.metainfo.xml "$work/"
          cp build/flatpak/seekie-chat.sh "$work/"
          cp build/icon.png "$work/icon.png"
          cd "$work"
          flatpak-builder --user --disable-rofiles-fuse --repo=repo --force-clean build-dir io.github.shellexy.SeekieChat.yml
          version="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          flatpak build-bundle repo "seekie-chat-${version}-x86_64.flatpak" io.github.shellexy.SeekieChat
          mkdir -p "$GITHUB_WORKSPACE/release"
          mv ./*.flatpak "$GITHUB_WORKSPACE/release/"
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          if-no-files-found: error
          path: release/*.flatpak

  release:
    name: 发布到 Releases
    # 手动触发只验证构建，不碰 Releases。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
